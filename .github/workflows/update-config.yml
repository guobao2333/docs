name: Update CI-specific config files

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: List files (debug)
      run: ls -la

    - name: Upload config as artifact
      uses: actions/upload-artifact@v7
      with:
        name: npm-lockfile
        path: |
            package.json
            package-lock.json
        include-hidden-files: true

    - name: Create Pull Request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      run: |
        if [ -z "$(git status --porcelain package.json package-lock.json)" ]; then
          echo "No changes detected, skipping PR creation."
          exit 0
        fi
    
        BRANCH="update-ci-config"
        BASE="${{ github.event.repository.default_branch }}"
    
        git checkout -b "$BRANCH"
        git add package.json package-lock.json
        git commit -m "chore: update CI-specific config files"
        git push -u origin "$BRANCH" --force
    
        gh pr view "$BRANCH" >/dev/null 2>&1 \
          && echo "PR already exists, branch updated." \
          || gh pr create \
               --title "chore: update CI-specific config files" \
               --body "This PR updates CI-specific config files generated by \`npm install\`." \
               --base "$BASE" \
               --head "$BRANCH"
